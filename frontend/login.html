<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Electronic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" type="image/svg+xml" href="assets/icons/agent-face.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/chat.css">
</head><body>
<header id="site-header" class="topbar"></header>
<main class="wrap">
<h1>Log in</h1>
<form class="stack" id="authForm" data-mode="login">
<label>Email<input id="email" type="email" required autocomplete="email"></label>
<label>Password<input id="password" type="password" required autocomplete="current-password"></label>
<p id="authErr" class="err" role="alert"></p>
<button class="btn">Log in</button>
<p class="muted">New here? <a href="register.html">Create an account</a></p></form>
</main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/chatbot.js"></script>
</body></html>
